# cava, configured to be read by the plugin rather than by a human.
#
# It taps the default output's monitor, so the meters follow whatever the
# machine is playing through — this plugin, a browser tab, anything — and keep
# working when the output is switched from speakers to headphones.

[general]
mode = normal
framerate = 60
bars = 64
autosens = 1
sensitivity = 100
lower_cutoff_freq = 30
higher_cutoff_freq = 16000

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 45
